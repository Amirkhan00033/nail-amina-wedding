<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список гостей — Наиль & Амина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(145deg, #faf7f2 0%, #f2e8da 100%);
      color: #2c2623;
      min-height: 100dvh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 20px 55px rgba(44, 38, 35, 0.08);
      border: 1px solid #ebe3d7;
    }

    .badge {
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #96774b;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      text-align: center;
      color: #2c2623;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      font-size: 13px;
      color: #786e67;
      margin-bottom: 24px;
    }

    .auth-box {
      display: flex;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto 12px;
    }

    input {
      flex: 1;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid #dfd3c3;
      background: #faf7f2;
      font-family: inherit;
      font-size: 14px;
      color: #2c2623;
      outline: none;
    }

    input:focus {
      border-color: #b89768;
      background: #fff;
    }

    button {
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: #b89768;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover { background: #96774b; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      text-align: center;
      font-size: 13px;
      color: #b83b3b;
      margin-top: 8px;
      min-height: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-input {
      max-width: 260px;
      padding: 9px 13px;
      font-size: 13px;
    }

    .refresh {
      padding: 9px 14px;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: #faf7f2;
      border: 1px solid #ebe3d7;
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 11.5px;
      color: #786e67;
      margin-top: 4px;
    }

    .yes-num { color: #2f7a4b; }
    .no-num { color: #b84a4a; }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 560px) {
      .cols { grid-template-columns: 1fr; }
      .auth-box { flex-direction: column; }
      .search-input { max-width: 100%; }
    }

    .box {
      background: #faf7f2;
      border: 1px solid #ebe3d7;
      border-radius: 18px;
      padding: 16px;
    }

    .box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .box.yes h2 { color: #2f7a4b; }
    .box.no h2 { color: #b84a4a; }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      background: #ffffff;
      border: 1px solid #efe8dc;
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .pill {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f4ece0;
      color: #87683e;
      white-space: nowrap;
    }

    .meta {
      font-size: 11.5px;
      color: #8c8279;
    }

    .wish {
      font-size: 12px;
      color: #564b44;
      background: #faf7f2;
      padding: 7px 9px;
      border-radius: 8px;
    }

    .empty {
      text-align: center;
      color: #8c8279;
      font-size: 13px;
      padding: 12px 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Личный кабинет молодожёнов</div>
    <h1>Гости — Наиль & Амина</h1>
    <p class="sub">20 декабря 2026 · 17:00 · Кафе «Мирас», с. Чарын</p>

    <div id="auth-section">
      <div class="auth-box">
        <input type="password" id="pin-input" placeholder="Введите пароль для просмотра" />
        <button id="login-btn" type="button">Войти</button>
      </div>
      <p id="auth-msg" class="msg"></p>
    </div>

    <div id="content" style="display: none;">
      <div class="top-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по имени..." />
        <button id="refresh-btn" class="refresh" type="button">Обновить</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-num yes-num" id="count-yes">0</div>
          <div class="stat-label">Придут (чел.)</div>
        </div>
        <div class="stat">
          <div class="stat-num no-num" id="count-no">0</div>
          <div class="stat-label">Не смогут</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="count-all">0</div>
          <div class="stat-label">Всего ответов</div>
        </div>
      </div>

      <div class="cols">
        <div class="box yes">
          <h2>✓ Придут</h2>
          <ul id="list-yes"></ul>
        </div>
        <div class="box no">
          <h2>✕ Не смогут</h2>
          <ul id="list-no"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz610E8Sy4Sr0p0sV0NRV6EFNcVCZr5c0VH14_NUvNoSm4_7kyCU1cednIXRTrZrEOw0Q/exec';
    const ACCESS_PIN = '1212'; // Замени на свой пароль перед сдачей

    const pinInput = document.getElementById('pin-input');
    const loginBtn = document.getElementById('login-btn');
    const authMsg = document.getElementById('auth-msg');
    const authSection = document.getElementById('auth-section');
    const content = document.getElementById('content');
    const refreshBtn = document.getElementById('refresh-btn');
    const searchInput = document.getElementById('search-input');

    let allGuests = [];

    function unlock() {
      if (pinInput.value.trim() !== ACCESS_PIN) {
        authMsg.textContent = 'Неверный пароль';
        return;
      }
      authMsg.textContent = '';
      authSection.style.display = 'none';
      content.style.display = 'block';
      loadGuests();
    }

    function renderFiltered() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = query
        ? allGuests.filter((g) => String(g.name || '').toLowerCase().includes(query))
        : allGuests;

      const yesList = filtered.filter((g) => g.answer === 'Приду');
      const noList = filtered.filter((g) => g.answer !== 'Приду');

      const yesPeople = allGuests
        .filter((g) => g.answer === 'Приду')
        .reduce((sum, g) => sum + (parseInt(g.count, 10) || 1), 0);

      document.getElementById('count-yes').textContent = yesPeople;
      document.getElementById('count-no').textContent = allGuests.filter((g) => g.answer !== 'Приду').length;
      document.getElementById('count-all').textContent = allGuests.length;

      renderList('list-yes', yesList, 'Пока никто не подтвердил', true);
      renderList('list-no', noList, 'Отказов пока нет', false);
    }

    function loadGuests() {
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Загрузка...';

      fetch(SCRIPT_URL)
        .then((res) => res.json())
        .then((data) => {
          allGuests = Array.isArray(data.guests) ? data.guests : [];
          renderFiltered();
        })
        .catch(() => {
          alert('Не удалось загрузить список. Проверь доступ к скрипту (должен быть открыт для «Все»).');
        })
        .finally(() => {
          refreshBtn.disabled = false;
          refreshBtn.textContent = 'Обновить';
        });
    }

    function renderList(elId, items, emptyText, showCount) {
      const ul = document.getElementById(elId);
      ul.innerHTML = '';

      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = emptyText;
        ul.appendChild(li);
        return;
      }

      items.forEach((item) => {
        const li = document.createElement('li');

        const top = document.createElement('div');
        top.className = 'row-top';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = item.name;
        top.appendChild(nameSpan);

        if (showCount) {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = `${item.count || 1} чел.`;
          top.appendChild(pill);
        }

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = item.date || '';

        li.appendChild(top);
        li.appendChild(meta);

        if (item.wishes) {
          const wishDiv = document.createElement('div');
          wishDiv.className = 'wish';
          wishDiv.textContent = item.wishes;
          li.appendChild(wishDiv);
        }

        ul.appendChild(li);
      });
    }

    loginBtn.addEventListener('click', unlock);
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });
    refreshBtn.addEventListener('click', loadGuests);
    searchInput.addEventListener('input', renderFiltered);
  </script>
</body>
</html>
