<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список гостей — Наиль & Амина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fdf2f4, #f7e6ea);
            color: #2d2326;
            min-height: 100dvh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .wrap {
            width: 100%;
            max-width: 560px;
            background: rgba(255, 250, 251, 0.96);
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 20px 50px rgba(110, 58, 72, 0.14);
            border: 1px solid rgba(201, 123, 142, 0.28);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            text-align: center;
            margin-bottom: 6px;
        }
        .sub {
            text-align: center;
            font-size: 13px;
            color: #8c6d75;
            margin-bottom: 22px;
        }
        .auth-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid #e7cfd5;
            font-family: inherit;
            font-size: 14px;
        }
        button {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            background: #9e5668;
            color: #fff;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #844555; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: #fdf4f6;
            border: 1px solid rgba(201, 123, 142, 0.25);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
        }
        .stat-num { font-size: 22px; font-weight: 600; }
        .stat-label { font-size: 11px; color: #8c6d75; margin-top: 2px; }
        .yes-num { color: #457b52; }
        .no-num { color: #a85454; }
        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 500px) { .cols { grid-template-columns: 1fr; } }
        .box {
            background: #fff;
            border: 1px solid #eed9de;
            border-radius: 14px;
            padding: 14px;
        }
        .box h2 { font-size: 14px; margin-bottom: 10px; }
        .box.yes h2 { color: #457b52; }
        .box.no h2 { color: #a85454; }
        ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        li {
            font-size: 13.5px;
            padding: 8px 10px;
            border-radius: 8px;
            background: #fdf7f8;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .date { font-size: 11px; color: #9a8087; white-space: nowrap; }
        .msg { text-align: center; font-size: 13px; color: #a85454; margin-top: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .refresh { padding: 8px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Гости — Наиль & Амина</h1>
        <p class="sub">12 декабря 2026 · 18:00 · кафе «Мирас»</p>

        <div id="auth-section">
            <div class="auth-box">
                <input type="password" id="pin-input" placeholder="Введи пароль для просмотра">
                <button id="login-btn" type="button">Войти</button>
            </div>
            <p id="auth-msg" class="msg"></p>
        </div>

        <div id="content" style="display: none;">
            <div class="top-bar">
                <span style="font-size: 12px; color: #8c6d75;">Актуальные ответы</span>
                <button id="refresh-btn" class="refresh" type="button">Обновить</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num yes-num" id="count-yes">0</div>
                    <div class="stat-label">Придут</div>
                </div>
                <div class="stat">
                    <div class="stat-num no-num" id="count-no">0</div>
                    <div class="stat-label">Не смогут</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="count-all">0</div>
                    <div class="stat-label">Всего ответов</div>
                </div>
            </div>

            <div class="cols">
                <div class="box yes">
                    <h2>✓ Придут</h2>
                    <ul id="list-yes"></ul>
                </div>
                <div class="box no">
                    <h2>✕ Не смогут</h2>
                    <ul id="list-no"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz610E8Sy4Sr0p0sV0NRV6EFNcVCZr5c0VH14_NUvNoSm4_7kyCU1cednIXRTrZrEOw0Q/exec';
        const ACCESS_PIN = '1212'; // Поменяй на свой пароль

        const pinInput = document.getElementById('pin-input');
        const loginBtn = document.getElementById('login-btn');
        const authMsg = document.getElementById('auth-msg');
        const authSection = document.getElementById('auth-section');
        const content = document.getElementById('content');
        const refreshBtn = document.getElementById('refresh-btn');

        function unlock() {
            if (pinInput.value.trim() !== ACCESS_PIN) {
                authMsg.textContent = 'Неверный пароль';
                return;
            }
            authMsg.textContent = '';
            authSection.style.display = 'none';
            content.style.display = 'block';
            loadGuests();
        }

        function loadGuests() {
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Загрузка...';

            fetch(SCRIPT_URL)
                .then((res) => res.json())
                .then((data) => {
                    const guests = Array.isArray(data.guests) ? data.guests : [];
                    const yesList = guests.filter((g) => g.answer === 'Приду');
                    const noList = guests.filter((g) => g.answer === 'Не приду');

                    document.getElementById('count-yes').textContent = yesList.length;
                    document.getElementById('count-no').textContent = noList.length;
                    document.getElementById('count-all').textContent = guests.length;

                    renderList('list-yes', yesList, 'Пока никто не подтвердил');
                    renderList('list-no', noList, 'Отказов пока нет');
                })
                .catch(() => {
                    alert('Не удалось загрузить список. Проверь доступ к скрипту.');
                })
                .finally(() => {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Обновить';
                });
        }

        function renderList(elId, items, emptyText) {
            const ul = document.getElementById(elId);
            ul.innerHTML = '';
            if (!items.length) {
                ul.innerHTML = `<li style="color:#9a8087; justify-content:center;">${emptyText}</li>`;
                return;
            }
            items.forEach((item) => {
                const li = document.createElement('li');
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                const dateSpan = document.createElement('span');
                dateSpan.className = 'date';
                dateSpan.textContent = item.date;
                li.appendChild(nameSpan);
                li.appendChild(dateSpan);
                ul.appendChild(li);
            });
        }

        loginBtn.addEventListener('click', unlock);
        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') unlock();
        });
        refreshBtn.addEventListener('click', loadGuests);
    </script>
</body>
</html>
